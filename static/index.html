<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Internet Search</title>
  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <!-- KaTeX for math / scientific notation -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg:          #0d0d14;
      --surface:     #14141f;
      --surface2:    #1c1c2a;
      --border:      #2a2a3e;
      --primary:     #7c6dfa;
      --primary-dim: rgba(124,109,250,.18);
      --text:        #e2e2f0;
      --muted:       #7878a0;
      --green:       #4ade80;
      --red:         #f87171;
      --radius:      12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      width: 34px; height: 34px;
      background: var(--primary);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    .badge {
      background: var(--primary);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .free-badge {
      background: #166534;
      color: #4ade80;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* ── Main layout ── */
    main { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }

    /* ── Search card ── */
    .search-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      left: 16px;
      color: var(--muted);
      font-size: 16px;
      pointer-events: none;
      transition: color .2s;
      line-height: 1;
    }
    #query {
      flex: 1;
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 40px 18px 40px 44px;
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    #query:focus {
      border-color: var(--primary);
      background: var(--bg);
      box-shadow: 0 0 0 3px rgba(124,109,250,.18), 0 2px 12px rgba(0,0,0,.3);
    }
    .search-wrap:focus-within .search-icon { color: var(--primary); }
    #query::placeholder { color: var(--muted); font-size: 15px; }
    #search-btn {
      background: linear-gradient(135deg, #7c6dfa 0%, #a78bfa 100%);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 20px 28px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: .02em;
      transition: transform .15s, box-shadow .15s, opacity .15s;
      box-shadow: 0 4px 14px rgba(124,109,250,.4);
    }
    #search-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124,109,250,.55);
    }
    #search-btn:active:not(:disabled) { transform: translateY(0); }
    #search-btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

    /* ── Sliders ── */
    .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .setting-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .setting-group label .val {
      color: var(--primary);
      font-weight: 700;
      font-size: 13px;
    }
    input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }
    .toggle-row {
      grid-column: span 2;
      display: flex;
      align-items: center;
      gap: 9px;
      padding-top: 2px;
    }
    .toggle-row label { font-size: 12px; color: var(--muted); cursor: pointer; }
    input[type="checkbox"] { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }

    /* ── Status bar ── */
    #status-bar {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 16px;
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--muted);
    }
    #status-bar.show { display: flex; }
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Progress bar */
    #progress-wrap {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 18px;
      overflow: hidden;
      display: none;
    }
    #progress-wrap.show { display: block; }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 2px;
      transition: width .3s ease;
    }

    /* ── Summary card ── */
    #summary-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--primary);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 0 40px var(--primary-dim);
    }
    #summary-card.show { display: block; }
    #summary-card h2 {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    /* Markdown output styling */
    .md-body { font-size: 13.5px; line-height: 1.75; color: var(--text); }
    .md-body h1,.md-body h2 { margin: 16px 0 8px; color: var(--text); font-size: 15px; }
    .md-body h3 { margin: 12px 0 6px; color: var(--text); font-size: 14px; }
    .md-body p { margin-bottom: 10px; }
    .md-body strong { color: #c4b5fd; }
    .md-body a { color: var(--green); text-decoration: none; }
    .md-body a:hover { text-decoration: underline; }
    .md-body ul,.md-body ol { padding-left: 20px; margin-bottom: 10px; }
    .md-body li { margin-bottom: 4px; }
    .md-body code {
      background: var(--surface2);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
      font-family: 'Fira Code', 'Cascadia Code', monospace;
    }
    .md-body pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      margin-bottom: 12px;
    }
    .md-body pre code { background: transparent; padding: 0; font-size: 12px; }
    /* KaTeX display math */
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 6px 0; }
    .katex { font-size: 1em; }
    .tab-placeholder { font-size: 13px; color: var(--muted); padding: 6px 0; }

    /* ── Summary tabs ── */
    .summary-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin: 12px 0 16px;
    }
    .sum-tab {
      display: flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      margin-bottom: -1px;
    }
    .sum-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .sum-tab:hover:not(.active) { color: var(--text); }
    .tab-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      transition: background .3s;
    }
    .tab-dot.streaming { background: var(--primary); animation: pulse .9s ease-in-out infinite; }
    .tab-dot.done { background: var(--green); animation: none; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.2; } }

    /* ── Results ── */
    #results-header {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      display: none;
    }
    #results-header.show { display: block; }
    .results-grid { display: flex; flex-direction: column; gap: 10px; }
    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      animation: fadeUp .25s ease both;
      transition: border-color .15s;
    }
    .result-card:hover { border-color: var(--primary); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .result-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .result-title a { color: var(--text); text-decoration: none; }
    .result-title a:hover { color: var(--primary); }
    .result-url {
      font-size: 11px;
      color: var(--green);
      margin-bottom: 7px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-snippet { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
    .result-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 10.5px;
      color: var(--muted);
    }
    .tag.content { border-color: #166534; color: var(--green); }

    /* ── Mobile (iPhone 17 Pro and up: 393px) ── */
    @media (max-width: 640px) {
      header { padding: 10px 16px; gap: 8px; }
      header h1 { font-size: 15px; }
      .badge, .free-badge { font-size: 9px; padding: 2px 6px; }
      main { padding: 12px 12px 60px; }

      .search-card { padding: 14px; border-radius: 12px; margin-bottom: 14px; }
      .input-row { gap: 8px; margin-bottom: 12px; }
      .input-row { flex-direction: column; }
      .search-wrap { width: 100%; }
      #query { font-size: 15px; padding: 36px 16px 36px 42px; }
      #search-btn { padding: 18px 16px; font-size: 14px; width: 100%; border-radius: 6px; }

      .settings { grid-template-columns: 1fr; gap: 12px; margin-top: 4px; }
      .toggle-row {
        grid-column: span 1 !important;
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 10px;
      }
      .toggle-row > div { width: 100%; margin-left: 0 !important; }
      #model-select { width: 100%; max-width: 100%; box-sizing: border-box; }

      #summary-card { padding: 16px; border-radius: 12px; }
      .summary-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .sum-tab { font-size: 11px; padding: 7px 11px; white-space: nowrap; }
      .md-body { font-size: 13px; }
      .md-body pre { max-width: 100%; overflow-x: auto; }

      #results-header { font-size: 11px; }
      .result-card { padding: 11px 13px; border-radius: 10px; }
      .result-title { font-size: 13px; }
      .result-url { word-break: break-all; white-space: normal; }
      .result-snippet { font-size: 12px; }
    }
  
  /* ── Top nav ── */
  .top-nav {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .nav-tab {
    background: none;
    border: none;
    border-bottom: 2.5px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    margin-bottom: -1px;
    transition: color .15s, border-color .15s;
  }
  .nav-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .nav-tab:hover:not(.active) { color: var(--text); }

  /* ── Live section ── */
  #live-section { display: none; }
  #live-section.show { display: block; }
  #search-section { display: block; }
  #search-section.hide { display: none; }

  .live-cats {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .live-cat {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 14px;
    transition: all .15s;
  }
  .live-cat.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .live-cat:hover:not(.active) { border-color: var(--primary); color: var(--text); }

  .live-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .live-refresh-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    padding: 4px 10px;
  }
  .live-refresh-btn:hover { border-color: var(--primary); color: var(--primary); }

  .live-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
  }
  .live-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    transition: border-color .15s;
  }
  .live-card:hover { border-color: var(--primary); }
  .live-card-source {
    font-size: 10px;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-bottom: 6px;
  }
  .live-card-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .live-card-title a {
    color: var(--text);
    text-decoration: none;
  }
  .live-card-title a:hover { color: var(--primary); }
  .live-card-meta {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .live-card-snippet {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .live-summarize-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
    padding: 4px 10px;
    transition: all .15s;
  }
  .live-summarize-btn:hover { border-color: var(--primary); color: var(--primary); }
  .live-summarize-btn:disabled { opacity: .5; cursor: default; }
  .live-ai-summary {
    background: var(--surface2);
    border-left: 3px solid var(--primary);
    border-radius: 0 6px 6px 0;
    font-size: 12.5px;
    line-height: 1.6;
    margin-top: 10px;
    padding: 8px 12px;
    color: var(--text);
    display: none;
  }
  .live-ai-summary.show { display: block; }
  .live-loading {
    color: var(--muted);
    font-size: 13px;
    padding: 40px 0;
    text-align: center;
  }
  @media (max-width: 640px) {
    .live-grid { grid-template-columns: 1fr; }
    .live-cats { gap: 6px; }
  }

</style>
</head>
<body>

<header>
  <div class="logo">🔍</div>
  <h1>AI Internet Search</h1>
  <span class="badge">Ollama</span>
  <span class="free-badge">100% Free</span>
</header>

<main>
  <!-- Top nav -->
  <div class="top-nav">
    <button class="nav-tab" id="nav-search" onclick="switchView('search')">🔍 Search</button>
    <button class="nav-tab active" id="nav-live" onclick="switchView('live')">📡 Live</button>
  </div>

  <!-- Live section -->
  <div id="live-section" class="show">
    <div class="live-cats" id="live-topics">
      <button class="live-cat live-topic active" data-topic="world"    onclick="selectTopic('world')">🌍 World</button>
      <button class="live-cat live-topic"         data-topic="politics" onclick="selectTopic('politics')">🏛️ Politics</button>
      <button class="live-cat live-topic"         data-topic="sports"   onclick="selectTopic('sports')">⚽ Sports</button>
      <button class="live-cat live-topic"         data-topic="tech"     onclick="selectTopic('tech')">💻 Tech</button>
      <button class="live-cat live-topic"         data-topic="finance"  onclick="selectTopic('finance')">📈 Finance</button>
      <button class="live-cat live-topic"         data-topic="science"  onclick="selectTopic('science')">🔬 Science</button>
    </div>
    <div class="live-cats" id="live-regions" style="margin-top:4px">
      <button class="live-cat live-region active" data-region="world"     onclick="selectRegion('world')">🌐 All</button>
      <button class="live-cat live-region"        data-region="usa"       onclick="selectRegion('usa')">🇺🇸 USA</button>
      <button class="live-cat live-region"        data-region="india"     onclick="selectRegion('india')">🇮🇳 India</button>
      <button class="live-cat live-region"        data-region="china"     onclick="selectRegion('china')">🇨🇳 China</button>
      <button class="live-cat live-region"        data-region="europe"    onclick="selectRegion('europe')">🇪🇺 Europe</button>
      <button class="live-cat live-region"        data-region="australia" onclick="selectRegion('australia')">🇦🇺 Australia</button>
    </div>
    <div class="live-header">
      <span id="live-status">Select a category to load headlines</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="live-countdown" style="font-size:11px;opacity:0.7"></span>
        <select id="live-interval" onchange="changeInterval()" style="background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:6px;padding:3px 6px;font-size:12px;cursor:pointer">
          <option value="60" selected>1 min</option>
          <option value="300">5 min</option>
          <option value="600">10 min</option>
          <option value="1200">20 min</option>
          <option value="1800">30 min</option>
          <option value="3600">1 hr</option>
        </select>
        <button class="live-refresh-btn" onclick="refreshLive()">↻ Refresh</button>
      </div>
    </div>
    <div class="live-grid" id="live-grid">
      <div class="live-loading">👆 Pick a category above</div>
    </div>
  </div>

  <!-- Search section -->
  <div id="search-section" class="hide">

  <!-- Search controls -->
  <div class="search-card">
    <div class="input-row">
      <div class="search-wrap">
        <span class="search-icon">&#128269;</span>
        <input id="query" type="text" placeholder="What do you want to research?" autofocus />
      </div>
      <button id="search-btn" onclick="startSearch()">Search</button>
    </div>

    <div class="settings">
      <div class="setting-group">
        <label>
          Pages
          <span class="val"><span id="pages-val">2</span> &nbsp;<small style="font-weight:400;color:var(--muted)">(~<span id="results-est">20</span> results)</small></span>
        </label>
        <input type="range" id="pages" min="1" max="20" value="2" oninput="onPagesChange(this.value)" />
      </div>

      <div class="setting-group">
        <label>
          Concurrency
          <span class="val" id="concurrency-val">5</span>
        </label>
        <input type="range" id="concurrency" min="1" max="20" value="5"
               oninput="document.getElementById('concurrency-val').textContent = this.value" />
      </div>

      <div class="toggle-row" style="grid-column:span 2;gap:18px;flex-wrap:wrap;align-items:center">
        <div style="display:flex;align-items:center;gap:9px">
          <input type="checkbox" id="fetch-content" checked />
          <label for="fetch-content">Fetch full page content (improves summary)</label>
        </div>
        <div style="display:flex;align-items:center;gap:9px;margin-left:auto">
          <label for="model-select" style="font-size:12px;color:var(--muted)">Model:</label>
          <select id="model-select" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:4px 8px;cursor:pointer;outline:none">
            <option value="qwen3:8b">qwen3:8b (recommended)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div id="status-bar"><div class="spinner"></div><span id="status-text">Ready</span></div>
  <div id="progress-wrap"><div id="progress-bar"></div></div>

  <!-- AI Summary -->
  <div id="summary-card">
    <div style="font-size:14px;font-weight:700;color:var(--primary)">🤖 AI Summary</div>
    <div class="summary-tabs">
      <button class="sum-tab active" data-depth="ultra_short" onclick="switchTab('ultra_short')">
        ⚡ Ultra Short <span class="tab-dot" id="dot-ultra_short"></span>
      </button>
      <button class="sum-tab" data-depth="summary" onclick="switchTab('summary')">
        📋 Summary <span class="tab-dot" id="dot-summary"></span>
      </button>
      <button class="sum-tab" data-depth="detailed" onclick="switchTab('detailed')">
        🔬 Detailed <span class="tab-dot" id="dot-detailed"></span>
      </button>
      <button class="sum-tab" data-depth="raw" onclick="switchTab('raw')">
        📄 Raw
      </button>
    </div>
    <div class="md-body" id="summary-content"></div>
  </div>

  <!-- Results -->
  <div id="results-header"></div>
  <div class="results-grid" id="results-grid"></div>
  </div>
</main>

<script>
  /* ── KaTeX render helper ── */
  const KATEX_OPTS = {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$',  right: '$',  display: false },
      { left: '\\(', right: '\\)', display: false },
      { left: '\\[', right: '\\]', display: true },
    ],
    throwOnError: false,
  };
  function renderMath(el) {
    if (typeof renderMathInElement === 'function') renderMathInElement(el, KATEX_OPTS);
  }

  /* ── Summary tab state ── */
  const DEPTHS = ['ultra_short', 'summary', 'detailed'];
  const summaryState = {};
  let activeTab = 'ultra_short';
  let rawPages = []; // collected raw content from fetched pages

  function resetSummaryState() {
    DEPTHS.forEach(d => {
      summaryState[d] = { raw: '', status: 'waiting' };
      const dot = document.getElementById('dot-' + d);
      if (dot) dot.className = 'tab-dot';
    });
    rawPages = [];
    activeTab = 'ultra_short';
    document.querySelectorAll('.sum-tab').forEach(b =>
      b.classList.toggle('active', b.dataset.depth === 'ultra_short')
    );
    document.getElementById('summary-content').innerHTML =
      '<div class="tab-placeholder">⏳ All three summaries will auto-generate after search…</div>';
  }

  function switchTab(depth) {
    activeTab = depth;
    document.querySelectorAll('.sum-tab').forEach(b =>
      b.classList.toggle('active', b.dataset.depth === depth)
    );
    renderActiveTab();
  }

  function renderRawTab() {
    const el = document.getElementById('summary-content');
    if (rawPages.length === 0) {
      el.innerHTML = '<div class="tab-placeholder">No page content fetched yet…</div>';
      return;
    }
    el.innerHTML = rawPages.map(p =>
      `<div style="margin-bottom:20px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px;word-break:break-all">
          <strong>#${p.index + 1}</strong> — <a href="${esc(p.url)}" target="_blank" style="color:var(--primary)">${esc(p.url)}</a>
        </div>
        <pre style="white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.55;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;overflow-x:auto;color:var(--text);margin:0">${esc(p.text || '(no content fetched)')}</pre>
      </div>`
    ).join('');
  }

  function renderActiveTab() {
    if (activeTab === 'raw') { renderRawTab(); return; }
    const state = summaryState[activeTab];
    const el = document.getElementById('summary-content');
    if (!state || state.status === 'waiting') {
      el.innerHTML = '<div class="tab-placeholder">⏳ Waiting to generate…</div>';
      return;
    }
    el.innerHTML = marked.parse(state.raw || '');
    if (state.status === 'done') renderMath(el);
  }

  /* ── Slider helpers ── */
  function onPagesChange(v) {
    document.getElementById('pages-val').textContent = v;
    document.getElementById('results-est').textContent = v * 10;
  }

  /* ── Status helpers ── */
  function setStatus(msg) {
    document.getElementById('status-bar').classList.add('show');
    document.getElementById('status-text').textContent = msg;
  }
  function hideStatus() { document.getElementById('status-bar').classList.remove('show'); }

  /* ── Progress bar ── */
  let progressTotal = 0;
  function initProgress(total) {
    progressTotal = total;
    document.getElementById('progress-wrap').classList.add('show');
    document.getElementById('progress-bar').style.width = '0%';
  }
  function tickProgress(done) {
    const pct = progressTotal ? Math.round((done / progressTotal) * 100) : 0;
    document.getElementById('progress-bar').style.width = pct + '%';
  }
  function hideProgress() {
    document.getElementById('progress-wrap').classList.remove('show');
    document.getElementById('progress-bar').style.width = '0%';
  }

  /* ── Result card ── */
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function addResult(r, header) {
    header.classList.add('show');
    const grid = document.getElementById('results-grid');
    const card = document.createElement('div');
    card.className = 'result-card';
    const contentTag = r.content_length > 0
      ? `<span class="tag content">📄 ${(r.content_length/1000).toFixed(1)}k chars</span>`
      : '';
    card.innerHTML = `
      <div class="result-title">
        <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>
      </div>
      <div class="result-url">${esc(r.url)}</div>
      <div class="result-snippet">${esc(r.snippet)}</div>
      <div class="result-meta">${contentTag}<span class="tag">#${r.index + 1}</span></div>
    `;
    grid.appendChild(card);
  }

  /* ── Main search ── */
  let abortCtrl = null;

  async function startSearch() {
    const query = document.getElementById('query').value.trim();
    if (!query) return;

    if (abortCtrl) abortCtrl.abort();
    abortCtrl = new AbortController();

    // Reset UI
    document.getElementById('results-grid').innerHTML = '';
    document.getElementById('summary-card').classList.remove('show');
    document.getElementById('results-header').classList.remove('show');
    document.getElementById('search-btn').disabled = true;
    document.getElementById('search-btn').textContent = 'Searching…';
    resetSummaryState();
    hideProgress();

    const body = {
      query,
      num_pages:     parseInt(document.getElementById('pages').value),
      concurrency:   parseInt(document.getElementById('concurrency').value),
      fetch_content: document.getElementById('fetch-content').checked,
      model:         document.getElementById('model-select').value,
      summary_depth: 'all',
    };

    setStatus('Starting search…');
    const header = document.getElementById('results-header');

    try {
      const response = await fetch('/search/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: abortCtrl.signal,
      });

      if (!response.ok) { setStatus(`Server error: ${response.status}`); return; }

      const reader = response.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      let doneCount = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() ?? '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let ev;
          try { ev = JSON.parse(line.slice(6)); } catch { continue; }

          switch (ev.type) {
            case 'status':
              setStatus(ev.message);
              break;

            case 'result': {
              const [d, t] = ev.progress.split('/').map(Number);
              if (t && doneCount === 0) initProgress(t);
              doneCount = d;
              tickProgress(d);
              header.textContent = `Results (${ev.progress})`;
              addResult(ev.result, header);
              if (ev.content_text) {
                rawPages.push({ index: ev.result.index, url: ev.result.url, text: ev.content_text });
                rawPages.sort((a, b) => a.index - b.index);
                document.getElementById('summary-card').classList.add('show');
                if (activeTab === 'raw') renderRawTab();
              }
              break;
            }

            case 'summary_start': {
              summaryState[ev.depth].status = 'streaming';
              const dot = document.getElementById('dot-' + ev.depth);
              if (dot) dot.className = 'tab-dot streaming';
              document.getElementById('summary-card').classList.add('show');
              // Auto-switch to first tab that starts streaming (if current is still waiting)
              if (summaryState[activeTab].status === 'waiting') switchTab(ev.depth);
              break;
            }

            case 'summary_chunk': {
              summaryState[ev.depth].raw += ev.text;
              if (ev.depth === activeTab) {
                document.getElementById('summary-content').innerHTML =
                  marked.parse(summaryState[ev.depth].raw);
              }
              break;
            }

            case 'summary_done': {
              summaryState[ev.depth].status = 'done';
              const dot = document.getElementById('dot-' + ev.depth);
              if (dot) dot.className = 'tab-dot done';
              // Re-render with KaTeX if this is the active tab
              if (ev.depth === activeTab) renderActiveTab();
              break;
            }

            case 'summary_error':
              setStatus('Summary error: ' + ev.message);
              break;

            case 'done':
              header.textContent = `${ev.total} results found`;
              break;

            case 'error':
              setStatus('Error: ' + ev.message);
              break;
          }
        }
      }
    } catch (err) {
      if (err.name !== 'AbortError') setStatus('Error: ' + err.message);
    } finally {
      hideStatus();
      hideProgress();
      document.getElementById('search-btn').disabled = false;
      document.getElementById('search-btn').textContent = 'Search';
    }
  }

  // Enter key
  document.getElementById('query').addEventListener('keydown', e => {
    if (e.key === 'Enter') startSearch();
  });

  // Populate model dropdown from /models
  (async () => {
    try {
      const models = await fetch('/models').then(r => r.json());
      const sel = document.getElementById('model-select');
      if (models.length) {
        sel.innerHTML = '';
        const preferred = ['qwen3:8b', 'gemma2:9b', 'llama3.1:8b-32k', 'llama3.1:8b', 'qwen2.5:7b', 'mistral:7b'];
        models.sort((a, b) => {
          const ia = preferred.indexOf(a), ib = preferred.indexOf(b);
          if (ia !== -1 && ib !== -1) return ia - ib;
          if (ia !== -1) return -1;
          if (ib !== -1) return 1;
          return a.localeCompare(b);
        });
        models.forEach((m, i) => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = i === 0 ? m + ' ★' : m;
          if (i === 0) opt.selected = true;
          sel.appendChild(opt);
        });
      }
    } catch {}
  })();

  // Init
  resetSummaryState();

  /* ── Live feed ── */
  let liveTopic  = 'world';
  let liveRegion = 'world';
  let liveCountdownTimer = null;
  let liveSecondsLeft = 60;

  function computeKey() {
    if (liveTopic === 'world') return liveRegion === 'world' ? 'world' : liveRegion;
    if (liveRegion === 'world') return liveTopic;
    return liveTopic + '-' + liveRegion;
  }

  function switchView(view) {
    const isLive = view === 'live';
    document.getElementById('live-section').classList.toggle('show', isLive);
    document.getElementById('search-section').classList.toggle('hide', isLive);
    document.getElementById('nav-search').classList.toggle('active', !isLive);
    document.getElementById('nav-live').classList.toggle('active', isLive);
    if (isLive && !liveTopic) selectTopic('world');
  }

  function selectTopic(topic) {
    liveTopic = topic;
    document.querySelectorAll('.live-topic').forEach(b =>
      b.classList.toggle('active', b.dataset.topic === topic)
    );
    loadLive(computeKey());
  }

  function selectRegion(region) {
    liveRegion = region;
    document.querySelectorAll('.live-region').forEach(b =>
      b.classList.toggle('active', b.dataset.region === region)
    );
    loadLive(computeKey());
  }

  // backward compat shim (used nowhere now but kept for safety)
  function selectCat(cat) { selectTopic(cat); }

  async function loadLive(cat) {
    const grid = document.getElementById('live-grid');
    const status = document.getElementById('live-status');
    grid.innerHTML = '<div class="live-loading">⏳ Loading headlines…</div>';
    status.textContent = 'Fetching feeds…';
    try {
      const resp = await fetch('/live/' + cat);
      const items = await resp.json();
      if (!items.length) {
        grid.innerHTML = '<div class="live-loading">No items found.</div>';
        status.textContent = 'No results';
        return;
      }
      grid.innerHTML = items.map((item, i) => `
        <div class="live-card" id="lc-${i}">
          <div class="live-card-source">${esc(item.source)}</div>
          <div class="live-card-title"><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)}</a></div>
          <div class="live-card-meta">${esc(item.published)}</div>
          <div class="live-card-snippet">${esc(item.snippet)}</div>
          <button class="live-summarize-btn" onclick="summarizeLive(${i},this)" data-title="${esc(item.title)}" data-url="${esc(item.url)}" data-snippet="${esc(item.snippet)}">✨ Summarize</button>
          <div class="live-ai-summary" id="las-${i}"></div>
        </div>
      `).join('');
      const ivSecs = getIntervalSecs();
      const ivLabel = ivSecs < 3600 ? `${ivSecs/60|0} min` : '1 hr';
      status.textContent = `${items.length} headlines · auto-refresh: ${ivLabel}`;
      startCountdown();
    } catch(e) {
      grid.innerHTML = '<div class="live-loading">⚠️ Failed to load feeds.</div>';
      status.textContent = 'Error loading feeds';
    }
  }

  function getIntervalSecs() {
    const el = document.getElementById('live-interval');
    return el ? parseInt(el.value) : 60;
  }

  function changeInterval() {
    startCountdown();
  }

  function startCountdown() {
    clearInterval(liveCountdownTimer);
    liveSecondsLeft = getIntervalSecs();
    const cd = document.getElementById('live-countdown');
    liveCountdownTimer = setInterval(() => {
      liveSecondsLeft--;
      const m = Math.floor(liveSecondsLeft / 60);
      const s = liveSecondsLeft % 60;
      cd.textContent = `↻ ${m}:${String(s).padStart(2,'0')}`;
      if (liveSecondsLeft <= 0) {
        clearInterval(liveCountdownTimer);
        refreshLive();
      }
    }, 1000);
  }

  function refreshLive() {
    loadLive(computeKey());
  }

  // Live is the default view — auto-load world on startup
  document.addEventListener('DOMContentLoaded', () => {
    selectTopic('world');
  });

  async function summarizeLive(idx, btn) {
    const title   = btn.dataset.title;
    const url     = btn.dataset.url;
    const snippet = btn.dataset.snippet;
    btn.disabled = true;
    btn.textContent = '⏳ Summarizing…';
    const box = document.getElementById('las-' + idx);
    box.classList.add('show');
    box.textContent = '';
    const modelEl = document.getElementById('model-select');
    const model = modelEl ? modelEl.value : 'qwen3:8b';
    try {
      const resp = await fetch('/live/summarize', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ title, url, snippet, model }),
      });
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() ?? '';
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const ev = JSON.parse(line.slice(6));
            if (ev.text) box.textContent += ev.text;
          } catch {}
        }
      }
      btn.textContent = '✅ Done';
    } catch(e) {
      box.textContent = 'Error: ' + e.message;
      btn.textContent = '✨ Summarize';
      btn.disabled = false;
    }
  }

</script>
</body>
</html>
